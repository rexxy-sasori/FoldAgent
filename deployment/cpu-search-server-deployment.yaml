apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-search-server
  namespace: liuyunxin
  labels:
    app: cpu-search-server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1  # Ensures at least one pod is always available during updates
  selector:
    matchLabels:
      app: cpu-search-server
  template:
    metadata:
      labels:
        app: cpu-search-server
    spec:
      containers:
      - name: cpu-search-server
        image: harbor.xa.xshixun.com:7443/hanfeigeng/local_search_server:cpu-v0.1.1
        command: ["bash", "-c"]
        args:
        - | 
          set -e
          echo "Downloading model..."
          HF_ENDPOINT=https://hf-mirror.com hf download Qwen/Qwen3-Embedding-8B
          
          echo "Validating model files..."
          python3 -c "
          from transformers import AutoConfig
          import os
          os.environ['HF_ENDPOINT'] = 'https://hf-mirror.com'
          try:
              config = AutoConfig.from_pretrained('Qwen/Qwen3-Embedding-8B', local_files_only=True)
              print('Model validation successful!')
          except Exception as e:
              print(f'Model validation failed: {e}')
              print('Cleaning up corrupted files and retrying...')
              import shutil
              model_path = '/root/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-8B'
              if os.path.exists(model_path):
                  shutil.rmtree(model_path)
              HF_ENDPOINT=https://hf-mirror.com hf download Qwen/Qwen3-Embedding-8B --force
              config = AutoConfig.from_pretrained('Qwen/Qwen3-Embedding-8B', local_files_only=True)
              print('Model validation successful after retry!')
          "
          
          echo "Starting CPU search server..."
          export CUDA_VISIBLE_DEVICES="" && python3 envs/cpu_search_server.py --host 0.0.0.0 --port 8000 --model Qwen/Qwen3-Embedding-8B --corpus Tevatron/browsecomp-plus-corpus --corpus-embedding-dataset miaolu3/browsecomp-plus --workers 32
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "64Gi"
            cpu: "16"
          requests:
            memory: "32Gi"
            cpu: "16"
        env:
        - name: CPU_WORKERS
          value: "16"
        - name: MAX_BATCH_SIZE
          value: "64"
        - name: BATCH_TIMEOUT
          value: "0.02"
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        - name: HF_ENDPOINT
          value: "https://hf-mirror.com"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: HF_TOKEN
        - name: http_proxy
          value: "http://192.168.3.226:7890"
        - name: https_proxy
          value: "http://192.168.3.226:7890"
        - name: HTTP_PROXY
          value: "http://192.168.3.226:7890"
        - name: HTTPS_PROXY
          value: "http://192.168.3.226:7890"
        - name: NO_PROXY
          value: "127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8,192.168.0.0/16,.liuyunxin"
        - name: no_proxy
          value: "127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8,192.168.0.0/16,.liuyunxin"
        - name: APT_PROXY
          value: "http://192.168.3.241:3142"
        - name: PIP_INDEX_URL
          value: "http://192.168.12.70:9181/repository/pypi-proxy/simple/"
        - name: PIP_TRUSTED_HOST
          value: "192.168.12.70"
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: TRANSFORMERS_CACHE
          value: "/root/.cache/huggingface"
        volumeMounts:
        - name: gpfshome
          mountPath: /root
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
      restartPolicy: Always
      volumes:
      - name: gpfshome
        persistentVolumeClaim:
          claimName: pvc-gpfshome-liuyunxin
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-search-server
  namespace: liuyunxin
spec:
  selector:
    app: cpu-search-server
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
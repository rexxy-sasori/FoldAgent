apiVersion: v1
kind: ConfigMap
metadata:
  name: rsync-config
  namespace: liuyunxin
data:
  rsyncd.conf: |
    # Rsync daemon configuration
    max connections = 10
    log file = /var/log/rsyncd.log
    
    # Module for /root (general storage)
    [root]
    path = /root
    comment = Root directory
    read only = no
    write only = no
    list = yes
    uid = root
    gid = root
    auth users = root
    secrets file = /etc/rsyncd.secrets
    
    # Module for /app (WebShop root)
    [app]
    path = /app
    comment = WebShop root directory
    read only = no
    write only = no
    list = yes
    uid = root
    gid = root
    auth users = root
    secrets file = /etc/rsyncd.secrets
  rsyncd.secrets: |
    root:swe_bench_sync
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsync-server
  namespace: liuyunxin
  labels:
    app: rsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsync
  template:
    metadata:
      labels:
        app: rsync
    spec:
      containers:
      - name: rsync
        image: harbor.xa.xshixun.com:7443/hanfeigeng/eeacms/rsync:linux-amd64-latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Copy secrets to writable location and set permissions
            cp /etc/rsyncd.secrets /tmp/rsyncd.secrets
            chmod 600 /tmp/rsyncd.secrets
            
            # Update config to use writable secrets file
            sed 's|/etc/rsyncd.secrets|/tmp/rsyncd.secrets|g' /etc/rsyncd.conf > /tmp/rsyncd.conf
            
            # Start the rsync daemon
            rsync --daemon --verbose --config=/tmp/rsyncd.conf
            
            # Keep the container alive
            sleep infinity
        ports:
        - containerPort: 873
        volumeMounts:
        - name: data-storage
          mountPath: /root
        - name: webshop-storage
          mountPath: /app/data
          subPath: data
        - name: rsync-config
          mountPath: /etc/rsyncd.conf
          subPath: rsyncd.conf
        - name: rsync-secrets
          mountPath: /etc/rsyncd.secrets
          subPath: rsyncd.secrets
        resources:
          limits:
            memory: 32Gi
            cpu: '16'
          requests:
            memory: 4Gi
            cpu: '2'
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: pvc-gpfshome-liuyunxin 
      - name: webshop-storage
        persistentVolumeClaim:
          claimName: webshop-data-pvc
      - name: rsync-config
        configMap:
          name: rsync-config
      - name: rsync-secrets
        configMap:
          name: rsync-config
          items:
          - key: rsyncd.secrets
            path: rsyncd.secrets
---
apiVersion: v1
kind: Service
metadata:
  name: rsync-service
  namespace: liuyunxin
spec:
  selector:
    app: rsync
  ports:
    - protocol: TCP
      port: 873
      targetPort: 873

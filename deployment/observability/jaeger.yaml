---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: liuyunxin
  labels:
    app: jaeger
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: all-in-one
    spec:
      containers:
      - name: jaeger
        image: harbor.xa.xshixun.com:7443/hanfeigeng/jaegertracing/all-in-one:1.52-linux-amd64
        ports:
        - containerPort: 5775
          name: zk-compact-trft
          protocol: UDP
        - containerPort: 5778
          name: config-rest
        - containerPort: 6831
          name: jg-compact-trft
          protocol: UDP
        - containerPort: 6832
          name: jg-binary-trft
          protocol: UDP
        - containerPort: 9411
          name: zipkin
        - containerPort: 14267
          name: collector
        - containerPort: 14268
          name: collector-http
        - containerPort: 14269
          name: health-check
        - containerPort: 16685
          name: query-grpc
        - containerPort: 16686
          name: query-http
        - containerPort: 16687
          name: query-health
        env:
        - name: SPAN_STORAGE_TYPE
          value: elasticsearch
        - name: ES_SERVER_URLS
          value: http://elasticsearch.liuyunxin:9200
        - name: ES_INDEX_PREFIX
          value: jaeger
        - name: ES_TIMEOUT
          value: "60s"
        # --- SUBPATH CONFIGURATION ---
        - name: QUERY_BASE_PATH
          value: "/jaeger" # Tells Jaeger to serve assets from /jaeger
        # --- EXISTING PROXY/ENV CONFIG ---
        - name: LOG_LEVEL
          value: info
        - name: http_proxy
          value: "http://192.168.3.226:7890"
        - name: https_proxy
          value: "http://192.168.3.226:7890"
        - name: HTTP_PROXY
          value: "http://192.168.3.226:7890"
        - name: HTTPS_PROXY
          value: "http://192.168.3.226:7890"
        - name: APT_PROXY
          value: "http://192.168.3.241:3142"
        - name: PIP_INDEX_URL
          value: "http://192.168.12.70:9181/repository/pypi-proxy/simple/"
        - name: PIP_TRUSTED_HOST
          value: "192.168.12.70"
        - name: HF_ENDPOINT
          value: "https://hf-mirror.com"
        - name: NO_PROXY
          value: "127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8,192.168.0.0/16,.liuyunxin,10.233.97.207"
        - name: no_proxy
          value: "127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8,192.168.0.0/16,.liuyunxin,10.233.97.207"
        # --- HEALTH CHECKS TO PREVENT RESTART LOOPS ---
        # We use the dedicated query-health port (16687) which is not affected by QUERY_BASE_PATH
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: liuyunxin
  labels:
    app: jaeger
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: all-in-one
spec:
  selector:
    app: jaeger
  ports:
  - name: zk-compact-trft
    port: 5775
    targetPort: 5775
    protocol: UDP
  - name: config-rest
    port: 5778
    targetPort: 5778
  - name: jg-compact-trft
    port: 6831
    targetPort: 6831
    protocol: UDP
  - name: jg-binary-trft
    port: 6832
    targetPort: 6832
    protocol: UDP
  - name: zipkin
    port: 9411
    targetPort: 9411
  - name: collector
    port: 14267
    targetPort: 14267
  - name: collector-http
    port: 14268
    targetPort: 14268
  - name: health-check
    port: 14269
    targetPort: 14269
  - name: query-grpc
    port: 16685
    targetPort: 16685
  - name: query-http
    port: 16686
    targetPort: 16686
  - name: query-health
    port: 16687
    targetPort: 16687
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang
  namespace: liuyunxin
  labels:
    app: sglang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang
  template:
    metadata:
      labels:
        app: sglang
    spec:
      containers:
      - name: nvidia-dcgm-exporter
        image: harbor.xa.xshixun.com:7443/hanfeigeng/docker.io/nvidia/dcgm-exporter:4.4.2-4.7.1-ubuntu22.04-linux-amd64
        ports:
        - containerPort: 9400
        securityContext:
          runAsUser: 0
          capabilities:
            add:
            - SYS_ADMIN
        resources:
          limits:
            memory: 500Mi
            cpu: "500m"
          requests:
            memory: 500Mi
            cpu: "500m"
        volumeMounts:
        - name: nvidia-libs
          mountPath: /usr/local/nvidia/lib
          readOnly: true
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib:/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu
        - name: DCGM_EXPORTER_LISTEN
          value: ":9400"
        - name: DCGM_EXPORTER_KUBERNETES
          value: "true"

      - name: sglang
        image: harbor.xa.xshixun.com:7443/hanfeigeng/lmsysorg/sglang:dev-pr-15153-linux-amd64-otel
        command: ["bash", "-c"]
        args:
        - |
          # Download model using HF mirror
          echo "Downloading model using HF mirror..."
          HF_ENDPOINT=https://hf-mirror.com huggingface-cli download --resume-download --local-dir-use-symlinks False ByteDance-Seed/Seed-OSS-36B-Instruct
          
          # Start sglang server
          echo "Starting sglang server..."
          python3 -m sglang.launch_server \
          --model-path ByteDance-Seed/Seed-OSS-36B-Instruct \
          --host 0.0.0.0 \
          --port 8080 \
          --context-length 49152 \
          --max-running-requests 32 \
          --chunked-prefill-size 8192 \
          --mem-fraction-static 0.9 \
          --enable-p2p-check \
          --log-level debug \
          --otlp-traces-endpoint jaeger:4317 \
          --enable-trace \
          --enable-metrics \
          --attention-backend triton \
          --sampling-backend flashinfer \
          --enable-cache-report \
          --enable-dynamic-batch-tokenizer \
          --schedule-policy lpm 
        ports:
        - containerPort: 8080
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: http_proxy
          value: "http://192.168.3.226:7890"
        - name: https_proxy
          value: "http://192.168.3.226:7890"
        - name: HTTP_PROXY
          value: "http://192.168.3.226:7890"
        - name: HTTPS_PROXY
          value: "http://192.168.3.226:7890"
        - name: APT_PROXY
          value: "http://192.168.3.241:3142"
        - name: PIP_INDEX_URL
          value: "http://192.168.12.70:9181/repository/pypi-proxy/simple/"
        - name: PIP_TRUSTED_HOST
          value: "192.168.12.70"
        - name: HF_ENDPOINT
          value: "https://hf-mirror.com"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: HF_TOKEN
        - name: NO_PROXY
          value: "0.0.0.0,127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8,192.168.0.0/16,.liuyunxin,jaeger"
        - name: no_proxy
          value: "0.0.0.0,127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8,192.168.0.0/16,.liuyunxin,jaeger"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger.liuyunxin:4317"  # Points to your Jaeger Service
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_SERVICE_NAME
          value: "sglang-seed-36b"      # This name will appear in the Jaeger UI
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
          value: "true"
        # SGLang-specific environment variables
        - name: SGLANG_ENABLE_TORCH_COMPILE
          value: "true"
        - name: SGLANG_ENABLE_TORCH_INFERENCE_MODE
          value: "true"
        - name: SGLANG_SET_CPU_AFFINITY
          value: "1"
        - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
          value: "1"
        - name: SGLANG_SKIP_P2P_CHECK
          value: "false"
        - name: SGLANG_CHUNKED_PREFIX_CACHE_THRESHOLD
          value: "8192"
        - name: SGLANG_DISABLE_REQUEST_LOGGING
          value: "true"
        - name: SGLANG_HEALTH_CHECK_TIMEOUT
          value: "60"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: "16"
          requests:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: "16"
        volumeMounts:
        - name: gpfshome
          mountPath: /root
      volumes:
      - name: gpfshome
        persistentVolumeClaim:
          claimName: pvc-gpfshome-liuyunxin
      - name: nvidia-libs
        hostPath:
          path: /usr/lib/x86_64-linux-gnu

---
apiVersion: v1
kind: Service
metadata:
  name: sglang
  namespace: liuyunxin
spec:
  selector:
    app: sglang
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: sglang-dcgm-exporter
  namespace: liuyunxin
spec:
  selector:
    app: sglang
  ports:
  - port: 9400
    targetPort: 9400
  type: ClusterIP
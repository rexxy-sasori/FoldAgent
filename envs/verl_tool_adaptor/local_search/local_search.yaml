tools:
  - name: search
    class_name: envs.verl_tool_adaptor.local_search.local_search_tool.LocalSearchTool
    config:
      type: native
      search_server_url: ${SEARCH_SERVER_URL:-"http://localhost:8000"}
    tool_schema:
      type: function
      function:
        name: search
        description: Search for relevant information in corpus
        parameters:
          type: object
          properties:
            query:
              type: string
              description: The search query to find relevant documents
            k:
              type: integer
              description: Number of top results to return (default: 20)
              default: 20
              minimum: 1
              maximum: 100
          required:
            - query

  - name: open_page
    class_name: envs.verl_tool_adaptor.local_search.local_search_tool.LocalSearchTool
    config:
      type: native
      search_server_url: ${SEARCH_SERVER_URL:-"http://localhost:8000"}
    tool_schema:
      type: function
      function:
        name: open_page
        description: Open a specific document by docid or URL to view its full content
        parameters:
          type: object
          properties:
            docid:
              type: string
              description: Document ID to open (alternative to URL)
            url:
              type: string
              description: URL to open (alternative to docid)
          required: []

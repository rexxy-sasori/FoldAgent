tools:
  - class_name: envs.verl_tool_adaptor.verl_tools.SearchTool
    config:
      search_server_url: ${SEARCH_SERVER_URL:http://localhost:8000}
      timeout: 30
    tool_schema:
      type: function
      function:
        name: search
        description: Performs a web search: supply a string 'query' and optional 'k'. The tool retrieves the top 'k' results (default 10) for the query, returning their docid, url, and document content (may be truncated based on token limits).
        parameters:
          type: object
          properties:
            query:
              type: string
              description: The query string for the search.
            k:
              type: integer
              description: Return the top k pages.
          required:
            - query

  - class_name: envs.verl_tool_adaptor.verl_tools.OpenPageTool
    config:
      search_server_url: ${SEARCH_SERVER_URL:http://localhost:8000}
      timeout: 30
    tool_schema:
      type: function
      function:
        name: open_page
        description: Open a page by docid or URL and return the complete content. Provide either 'docid' or 'url'; if both are provided, prefer 'docid'. The docid or URL must come from prior search tool results.
        parameters:
          type: object
          properties:
            docid:
              type: string
              description: Document ID from search results to resolve and fetch.
            url:
              type: string
              description: Absolute URL from search results to fetch.
          required: []
